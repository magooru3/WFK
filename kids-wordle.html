<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kids Wordle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Wordle">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<style>
  /* Palette is the original Wordle one. Everything is a token so the dark
     theme below can swap grounds without touching a single component rule. */
  :root {
    --correct: #6aaa64;
    --present: #c9b458;
    --absent: #787c7f;
    --border: #d3d6da;
    --border-active: #878a8c;
    --text: #1a1a1b;
    --text-soft: #5a5c60;
    --bg: #ffffff;
    --surface: #ffffff;
    --key-bg: #d3d6da;
    --key-active: #b9bcbf;
    --tile-text: #ffffff;
    --toast-bg: #1a1a1b;
    --toast-text: #ffffff;
    --hint-bg: #f4f5f6;
    --focus: #2f6fdb;
  }

  /* Dark theme uses NYT Wordle's own dark values rather than an inverted
     light palette, so the game still reads as Wordle at night. */
  @media (prefers-color-scheme: dark) {
    :root {
      --correct: #538d4e;
      --present: #b59f3b;
      --absent: #3a3a3c;
      --border: #3a3a3c;
      --border-active: #565758;
      --text: #d7dadc;
      --text-soft: #9ca0a4;
      --bg: #121213;
      --surface: #1e1e20;
      --key-bg: #818384;
      --key-active: #6e7071;
      --tile-text: #ffffff;
      --toast-bg: #d7dadc;
      --toast-text: #1a1a1b;
      --hint-bg: #26262a;
      --focus: #85a9f0;
    }
  }
  * { box-sizing: border-box; }
  html {
    /* iOS Safari toolbar-safe viewport height */
    height: 100%;
    overscroll-behavior-y: none;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    /* Clear the iPhone notch/Dynamic Island and home indicator in both orientations */
    padding: max(12px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }

  /* Transparent to layout in portrait; landscape promotes them to columns. */
  .panel, .stage { display: contents; }

  header {
    width: 100%;
    max-width: 500px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.05em;
    margin: 4px 0;
  }

  .subtitle {
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--text-soft);
    margin-bottom: 10px;
  }

  /* Keyboard users get a clear ring; pointer users never see it because
     every control blurs itself on click. */
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .grade-selector {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .grade-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid var(--border-active);
    background: var(--surface);
    color: var(--text);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }

  .grade-btn:hover { transform: translateY(-1px); }

  /* Inverts against the page ground in both themes - a hardcoded white here
     put white text on the light-grey pill in dark mode. */
  .grade-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 8px 0 4px;
    flex-wrap: wrap;
  }

  .icon-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 2px solid var(--border-active);
    background: var(--surface);
    color: var(--text);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }

  .icon-btn:hover { background: var(--hint-bg); }
  .icon-btn:disabled { opacity: 0.4; cursor: default; }

  /* Real Wordle shows transient messages as a floating pill rather than a
     reserved strip, so the message can't go stale in the layout. */
  #message-bar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 70;
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }

  #message-bar.show { opacity: 1; }

  /* The board is square-tiled, so its height is driven by its width. Cap the
     width by viewport height too, otherwise the keyboard gets pushed off the
     bottom on a phone and the kid has to scroll between guessing and typing. */
  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin: 8px auto;
    padding: 4px;
    width: min(340px, 92vw, 38vh);
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--text);
    user-select: none;
    -webkit-touch-callout: none;
    transform-style: preserve-3d;
  }

  .tile.filled {
    border-color: var(--border-active);
    animation: pop 0.1s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .tile.flip {
    animation: flip 0.55s ease forwards;
  }

  @keyframes flip {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); }
    51% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .tile.correct, .tile.present, .tile.absent {
    color: var(--tile-text);
    border-color: transparent;
  }
  .tile.correct { background: var(--correct); }
  .tile.present { background: var(--present); }
  .tile.absent { background: var(--absent); }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  /* Winning-row celebration. Declared after .tile.flip (equal specificity)
     so it takes over the transform once the flip has finished. */
  .bounce .tile { animation: bounce 0.55s ease both; }
  .bounce .tile:nth-child(1) { animation-delay: 0ms; }
  .bounce .tile:nth-child(2) { animation-delay: 80ms; }
  .bounce .tile:nth-child(3) { animation-delay: 160ms; }
  .bounce .tile:nth-child(4) { animation-delay: 240ms; }
  .bounce .tile:nth-child(5) { animation-delay: 320ms; }

  @keyframes bounce {
    0%   { transform: translateY(0); }
    35%  { transform: translateY(-22px); }
    55%  { transform: translateY(0); }
    72%  { transform: translateY(-7px); }
    100% { transform: translateY(0); }
  }

  #keyboard {
    /* Match the body's horizontal padding exactly so nothing clips on
       narrow phones (98vw alone was ~2px too wide once padding is added). */
    width: min(500px, calc(100vw - 16px));
    margin: 8px auto 0;
    user-select: none;
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .key {
    flex: 1;
    max-width: 44px;
    height: 52px;
    border-radius: 6px;
    border: none;
    background: var(--key-bg);
    color: var(--text);
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    transition: background 0.15s, color 0.15s;
  }

  .key.wide { max-width: 66px; font-size: 0.7rem; }
  .key:active { background: var(--key-active); }

  .key.correct { background: var(--correct); color: var(--tile-text); }
  .key.present { background: var(--present); color: var(--tile-text); }
  .key.absent { background: var(--absent); color: var(--tile-text); }

  #hint-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: min(340px, 92vw);
    margin: 4px 0;
  }

  /* Each tier is its own card with a warm rail, so a kid can see at a glance
     that the clues are getting more generous as they go. */
  .hint-line {
    background: var(--hint-bg);
    border-left: 4px solid var(--present);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: left;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
  }

  .hint-line.tier-3 { border-left-color: var(--correct); }

  .hint-line b {
    font-weight: 800;
    letter-spacing: 0.12em;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  #overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    color: var(--text);
    border-radius: 14px;
    padding: 24px;
    width: min(360px, 90vw);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    animation: modal-in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
  }

  @keyframes modal-in {
    from { opacity: 0; transform: translateY(12px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal h2 { margin: 0 0 8px; font-size: 1.5rem; }
  .modal .modal-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-soft);
  }
  .modal .word-reveal {
    font-size: 1.8rem;
    letter-spacing: 0.1em;
    color: var(--correct);
    margin: 4px 0 10px;
  }
  .modal .definition {
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-soft);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .play-again {
    background: var(--correct);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .play-again:hover { filter: brightness(1.05); }

  /* The piece is the falling/drifting wrapper; the inner span does the
     spinning. Splitting them keeps both transforms alive - a single element
     can only run one transform, so the earlier version's random start
     rotation was silently overwritten by the fall animation. */
  .confetti-piece {
    position: fixed;
    top: -14px;
    /* Below #overlay (50): confetti is fully visible during the winning-row
       bounce, then settles behind the dialog instead of covering the word. */
    z-index: 40;
    pointer-events: none;
    animation: fall linear forwards;
  }

  .confetti-piece i {
    display: block;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    animation: spin linear infinite;
  }

  @keyframes fall {
    to { transform: translate(var(--drift, 0px), 106vh); opacity: 0.35; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Colours are applied on JS timers rather than animation events, so
     switching the motion off still reveals every result - it just stops
     moving. Confetti is skipped in JS for the same preference. */
  @media (prefers-reduced-motion: reduce) {
    .tile.filled, .tile.flip, .shake, .bounce .tile,
    .confetti-piece, .confetti-piece i, .modal {
      animation: none !important;
    }
    * { transition-duration: 0.01ms !important; }
  }

  /* ---- Small phones (iPhone SE / mini, portrait) ---- */
  @media (max-width: 380px) {
    .tile { font-size: 1.4rem; }
    .key { height: 46px; font-size: 0.85rem; }
  }

  /* ---- Short portrait viewports: trim the chrome so the board and the
     keyboard stay on screen together. ---- */
  @media (orientation: portrait) and (max-height: 780px) {
    h1 { font-size: 1.6rem; margin: 0; }
    .subtitle { font-size: 0.75rem; margin-bottom: 8px; }
    header { padding-bottom: 8px; margin-bottom: 6px; }
    .toolbar { margin: 6px 0 2px; }
    .hint-line { font-size: 0.82rem; padding: 6px 9px; }
    #hint-box { gap: 4px; }
    .key { height: 46px; }
  }

  /* ---- Very short portrait (iPhone SE and friends) ---- */
  @media (orientation: portrait) and (max-height: 620px) {
    #board { width: min(340px, 92vw, 34vh); }
    .key { height: 42px; }
    .kb-row { gap: 5px; margin-bottom: 5px; }
    #keyboard { margin-top: 4px; }
  }

  /* ---- Touch tablets (iPad and similar): more room, so use it ---- */
  @media (min-width: 700px) and (pointer: coarse) {
    header { max-width: 620px; padding-bottom: 16px; }
    h1 { font-size: 2.6rem; }
    .subtitle { font-size: 1rem; }
    .grade-btn { font-size: 1.05rem; padding: 10px 22px; }
    .icon-btn { font-size: 1rem; padding: 8px 18px; }
    #message-bar { font-size: 1.05rem; }
    #hint-box { width: min(460px, 80vw); }
    .hint-line { font-size: 1rem; padding: 10px 12px; }

    #board { width: min(430px, 60vw); gap: 8px; padding: 10px; }
    .tile { font-size: 2.3rem; }

    #keyboard { width: min(640px, 82vw); margin-top: 16px; }
    .kb-row { gap: 8px; margin-bottom: 8px; }
    .key { max-width: 58px; height: 64px; font-size: 1.25rem; border-radius: 8px; }
    .key.wide { max-width: 84px; font-size: 0.95rem; }

    .modal { padding: 32px; width: min(420px, 70vw); }
    .modal h2 { font-size: 1.8rem; }
    .modal .word-reveal { font-size: 2.1rem; }
    .modal .definition { font-size: 1.05rem; }
  }

  /* ---- iPhone landscape: short viewport. Stacking everything vertically would
     force scrolling mid-guess, so reflow into two columns instead: info/controls
     on the left, board + keyboard stacked on the right, using the width
     landscape actually gives you. ---- */
  @media (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
    body {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    /* Each column now flows on its own, so the tall board no longer drags
       the sidebar's buttons down past it. */
    .panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: min(230px, 30vw);
      flex: none;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: none;
    }

    header {
      width: 100%;
      max-width: none;
      text-align: left;
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    h1 { font-size: 1.3rem; margin: 0 0 2px; }
    .subtitle { font-size: 0.7rem; margin-bottom: 6px; }
    .grade-selector { justify-content: flex-start; gap: 6px; }
    .grade-btn { padding: 4px 10px; font-size: 0.75rem; }

    .toolbar { justify-content: flex-start; margin: 0; gap: 6px; flex-wrap: nowrap; }
    .icon-btn { padding: 4px 9px; font-size: 0.72rem; white-space: nowrap; }

    #hint-box { width: 100%; gap: 4px; margin: 0; }
    .hint-line { font-size: 0.7rem; padding: 5px 7px; border-left-width: 3px; }

    #board { width: min(220px, 44vh); gap: 4px; margin: 0; padding: 0; }
    .tile { font-size: 1.25rem; border-radius: 3px; }

    #keyboard { width: min(360px, 58vw); margin: 6px 0 0; }
    .kb-row { gap: 4px; margin-bottom: 4px; }
    .key { height: 36px; font-size: 0.75rem; }
  }

  /* ---- iPad landscape gets the tablet rules above, but the tablet board and
     hint cards would run taller than the shorter landscape viewport, so cap
     them by viewport height instead of width here. ---- */
  @media (min-width: 900px) and (pointer: coarse) and (orientation: landscape) {
    #board { width: min(400px, 30vh); }
    .hint-line { font-size: 0.85rem; padding: 6px 10px; }
    #hint-box { gap: 4px; }
    h1 { font-size: 2rem; }
    header { padding-bottom: 8px; margin-bottom: 6px; }
    .key { height: 54px; }
    #keyboard { margin-top: 10px; }
  }
</style>
</head>
<body>

<!-- .panel and .stage are display:contents by default, so in portrait these
     wrappers are invisible to layout. Landscape turns them into real columns. -->
<div class="panel">
  <header>
    <h1>🐣 Kids Wordle</h1>
    <div class="subtitle">Guess the 5-letter word in 6 tries!</div>
    <div class="grade-selector" id="grade-selector">
      <button class="grade-btn" data-grade="k1">K–1</button>
      <button class="grade-btn" data-grade="g23">2–3</button>
      <button class="grade-btn" data-grade="g45">4–5</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="icon-btn" id="hint-btn">💡 Hint (3 left)</button>
    <button class="icon-btn" id="new-word-btn">🔄 New Word</button>
  </div>
  <div id="hint-box"></div>
</div>

<div id="message-bar" role="status" aria-live="polite"></div>

<div class="stage">
  <div id="board"></div>
  <div id="keyboard"></div>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">🎉 You got it!</h2>
    <div class="modal-label">The word was</div>
    <div class="word-reveal" id="modal-word"></div>
    <div class="definition" id="modal-definition"></div>
    <button class="play-again" id="play-again-btn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Word lists ----------
  // Each entry is [WORD, definition, category]. `category` is the vague,
  // no-letters-given first hint; `definition` is the more specific second
  // hint (and the answer explainer shown after a win); the third hint
  // layers the first letter on top of the definition.
  const WORD_LISTS = {
    k1: [
      ["HAPPY", "This word means feeling really glad and smiling.", "a feeling"],
      ["WATER", "You drink this and swim in it.", "something you drink"],
      ["HOUSE", "A building where a family lives.", "a place"],
      ["SMILE", "Your face does this when you are happy.", "something your face does"],
      ["APPLE", "A crunchy fruit that can be red or green.", "a fruit"],
      ["HORSE", "A big animal you can ride.", "an animal"],
      ["MUSIC", "Sounds you can sing or dance to.", "something you hear"],
      ["PARTY", "A fun celebration with friends and treats.", "a celebration"],
      ["SHEEP", "A fluffy farm animal that says baa.", "a farm animal"],
      ["SNAKE", "A long animal with no legs that slithers.", "an animal"],
      ["TIGER", "A big wild cat with orange and black stripes.", "a wild animal"],
      ["TOOTH", "You use this in your mouth to chew.", "a body part"],
      ["BREAD", "You use this to make a sandwich.", "a food"],
      ["CHAIR", "You sit on this.", "a piece of furniture"],
      ["CLOCK", "This tells you what time it is.", "something that tells time"],
      ["CANDY", "A sweet treat you love to eat.", "a sweet food"],
      ["CLOWN", "A funny person at the circus.", "a person"],
      ["MOMMY", "Another word for your mother.", "a family member"],
      ["SUGAR", "A sweet white ingredient used in baking.", "a food ingredient"],
      ["BUNNY", "A soft animal that hops and has long ears.", "an animal"],
      ["PUPPY", "A baby dog.", "a baby animal"],
      ["KITTY", "A baby cat.", "a baby animal"],
      ["BEACH", "A sandy place next to the ocean.", "a place"],
      ["GRAPE", "A small round fruit that grows in bunches.", "a fruit"],
      ["LEMON", "A sour yellow fruit.", "a fruit"],
      ["PIZZA", "A round food with cheese and toppings.", "a food"],
      ["ROBOT", "A machine that can move and do jobs.", "a machine"],
      ["SHARK", "A big fish with sharp teeth in the ocean.", "an ocean animal"],
      ["WHALE", "A huge animal that lives in the ocean.", "an ocean animal"],
      ["ZEBRA", "An animal like a horse with black and white stripes.", "an animal"]
    ],
    g23: [
      ["PLANT", "A living thing that grows in soil, like a flower or tree.", "a living thing"],
      ["STORY", "A tale you read or tell, with characters and events.", "something you read"],
      ["DANCE", "To move your body to music.", "something you do"],
      ["OCEAN", "A huge body of salty water.", "a body of water"],
      ["RIVER", "A long stream of water that flows to the sea.", "a body of water"],
      ["FIELD", "A big open piece of grassy land.", "a place"],
      ["CLOUD", "A fluffy white shape floating in the sky.", "something in the sky"],
      ["STORM", "Wild weather with rain, wind, or thunder.", "a type of weather"],
      ["LIGHT", "Something that helps you see in the dark.", "something you see"],
      ["NIGHT", "The time of day when it is dark and you sleep.", "a time of day"],
      ["SOUND", "Something you hear with your ears.", "something you hear"],
      ["SMELL", "Something you notice with your nose.", "one of your senses"],
      ["TASTE", "Something you notice with your tongue.", "one of your senses"],
      ["TOUCH", "Something you feel with your fingers.", "one of your senses"],
      ["GRASS", "The green plant that covers a lawn.", "a plant"],
      ["STONE", "A small hard rock.", "an object"],
      ["BRICK", "A hard block used to build walls.", "a building material"],
      ["GLASS", "A clear material used to make windows.", "a material"],
      ["PAINT", "Colorful liquid used to make pictures.", "an art supply"],
      ["BRUSH", "A tool with bristles used to paint or comb hair.", "a tool"],
      ["SPOON", "A utensil you use to eat soup or cereal.", "a utensil"],
      ["TABLE", "A piece of furniture you eat or work on.", "a piece of furniture"],
      ["CHESS", "A board game played with kings and queens.", "a game"],
      ["MONEY", "Coins and bills used to buy things.", "something you use to buy things"],
      ["PIANO", "A big instrument with black and white keys.", "a musical instrument"],
      ["FRUIT", "A sweet food that grows on plants, like an apple.", "a type of food"],
      ["BERRY", "A small round juicy fruit that often grows on a bush.", "a type of fruit"],
      ["HONEY", "A sweet golden food made by bees.", "a type of food"]
    ],
    g45: [
      ["BRAVE", "Having courage even when you are scared.", "a way to describe someone"],
      ["QUICK", "Moving very fast.", "a way to describe speed"],
      ["PLANE", "A flying machine that carries people in the sky.", "a vehicle"],
      ["EAGLE", "A large bird that hunts and flies very high.", "a bird"],
      ["MAGIC", "Amazing things that seem impossible, like in fairy tales.", "something in fairy tales"],
      ["DREAM", "Pictures and stories your mind makes while you sleep.", "something that happens while sleeping"],
      ["PEACE", "A calm feeling with no fighting or noise.", "a feeling or state"],
      ["POWER", "The strength or energy to do something.", "an ability"],
      ["SHINE", "To glow brightly, like the sun.", "something light does"],
      ["SPARK", "A tiny flash of light or fire.", "something related to fire"],
      ["TRUST", "Believing that someone will not let you down.", "a feeling between people"],
      ["HONOR", "Great respect shown to someone who did something good.", "a kind of respect"],
      ["PRIDE", "A happy feeling about something you did well.", "a feeling"],
      ["GLORY", "Great fame and honor for doing something amazing.", "a kind of fame"],
      ["LEARN", "To gain new knowledge or a new skill.", "something you do at school"],
      ["STUDY", "To work hard at learning something.", "something you do at school"],
      ["WORLD", "The whole planet Earth and everything on it.", "a very big place"],
      ["EARTH", "The planet we all live on.", "a planet"],
      ["SPACE", "The huge area beyond Earth with stars and planets.", "something beyond our planet"],
      ["GHOST", "A spooky spirit in stories, said to haunt places.", "a spooky story character"],
      ["GIANT", "A huge, very tall creature in stories.", "a story character"],
      ["CROWN", "A fancy hat worn by a king or queen.", "something royal"],
      ["SWORD", "A long sharp blade used by knights.", "a weapon"],
      ["ARROW", "A pointed stick shot from a bow.", "a weapon"],
      ["FLAME", "The bright hot part of a fire.", "part of a fire"],
      ["FROST", "A thin icy layer that forms on cold mornings.", "a type of weather"],
      ["NORTH", "The direction toward the top of a map.", "a direction"],
      ["SOUTH", "The direction toward the bottom of a map.", "a direction"],
      ["BRAIN", "The organ in your head that helps you think.", "a body part"],
      ["HEART", "The organ that pumps blood and can mean love.", "a body part"],
      ["SOLVE", "To figure out the answer to a problem.", "something you do with a problem"],
      ["THINK", "To use your brain to have ideas.", "something your brain does"],
      ["WRITE", "To put words down on paper.", "something you do with a pencil"],
      ["SPELL", "To say or write the letters of a word in order.", "something you do with letters"],
      ["LOGIC", "Clear thinking used to solve problems.", "a way of thinking"],
      ["SCALE", "A tool used to weigh things, or the size of something.", "a tool"],
      ["GRAPH", "A picture that shows information using bars or lines.", "something with numbers"]
    ]
  };

  // ---------- State ----------
  let grade = "k1";
  let targetWord = "";
  let targetHint = "";
  let targetCategory = "";
  let currentGuess = "";
  let currentRow = 0;
  let gameOver = false;
  // Set while a row is flipping. Without it, input typed during the ~1s
  // reveal is accepted as a real guess - including after a winning guess,
  // because gameOver only flips once the reveal timer fires.
  let isRevealing = false;
  let hintLevel = 0;
  let messageTimer = null;
  const MAX_HINTS = 3;
  const ROWS = 6;
  const COLS = 5;
  const REVEAL_MS = COLS * 120 + 400;
  const keyStatus = {};
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const KB_ROWS = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["ENTER","Z","X","C","V","B","N","M","BACK"]
  ];

  // ---------- DOM refs ----------
  const boardEl = document.getElementById("board");
  const keyboardEl = document.getElementById("keyboard");
  const messageBar = document.getElementById("message-bar");
  const hintBox = document.getElementById("hint-box");
  const hintBtn = document.getElementById("hint-btn");
  const newWordBtn = document.getElementById("new-word-btn");
  const gradeSelector = document.getElementById("grade-selector");
  const overlay = document.getElementById("overlay");
  const modalTitle = document.getElementById("modal-title");
  const modalWord = document.getElementById("modal-word");
  const modalDefinition = document.getElementById("modal-definition");
  const playAgainBtn = document.getElementById("play-again-btn");

  // ---------- Sound effects (Web Audio API, no external files) ----------
  // iOS Safari only lets an AudioContext start running if it is created (or
  // resumed) inside a real user gesture. Every sound here is fired from a
  // setTimeout during the reveal, which is NOT a gesture - so the context has
  // to be opened up front on the first touch/click/key, or the game is
  // silent on iPhone and iPad.
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function unlockAudio() {
    getCtx();
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
  }
  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function beep(freq, duration, type, startTime, gainVal) {
    const ctx = getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.value = gainVal || 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t = ctx.currentTime + (startTime || 0);
    osc.start(t);
    gain.gain.setValueAtTime(gain.gain.value, t + duration - 0.03);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    osc.stop(t + duration);
  }

  function playCorrectSound() {
    beep(523.25, 0.12, "triangle", 0);
    beep(659.25, 0.14, "triangle", 0.1);
  }
  function playPresentSound() {
    beep(440, 0.15, "sine", 0);
  }
  function playWrongSound() {
    beep(180, 0.2, "sawtooth", 0, 0.06);
  }
  function playWinSound() {
    const notes = [523.25, 587.33, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => beep(f, 0.22, "triangle", i * 0.13, 0.09));
  }
  function playLoseSound() {
    beep(300, 0.25, "sawtooth", 0, 0.07);
    beep(220, 0.35, "sawtooth", 0.2, 0.07);
  }

  // ---------- Build board ----------
  function buildBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement("div");
      row.className = "row";
      row.id = "row-" + r;
      for (let c = 0; c < COLS; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = "tile-" + r + "-" + c;
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }
  }

  // ---------- Build keyboard ----------
  function buildKeyboard() {
    keyboardEl.innerHTML = "";
    KB_ROWS.forEach((rowKeys) => {
      const rowEl = document.createElement("div");
      rowEl.className = "kb-row";
      rowKeys.forEach((k) => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.id = "key-" + k;
        btn.textContent = k === "BACK" ? "⌫" : (k === "ENTER" ? "Enter" : k);
        if (k === "ENTER" || k === "BACK") btn.classList.add("wide");
        btn.addEventListener("click", () => {
          btn.blur();
          handleKeyInput(k);
        });
        rowEl.appendChild(btn);
      });
      keyboardEl.appendChild(rowEl);
    });
  }

  // ---------- Game setup ----------
  function pickWord(g) {
    const list = WORD_LISTS[g];
    const entry = list[Math.floor(Math.random() * list.length)];
    return { word: entry[0], hint: entry[1], category: entry[2] };
  }

  function resetGame(newGrade) {
    if (newGrade) grade = newGrade;
    const picked = pickWord(grade);
    targetWord = picked.word;
    targetHint = picked.hint;
    targetCategory = picked.category;
    currentGuess = "";
    currentRow = 0;
    gameOver = false;
    isRevealing = false;
    hintLevel = 0;
    Object.keys(keyStatus).forEach((k) => delete keyStatus[k]);
    hintBox.innerHTML = "";
    clearMessage();
    overlay.classList.remove("show");
    hintBtn.disabled = false;
    updateHintButtonLabel();
    buildBoard();
    buildKeyboard();
    document.querySelectorAll(".grade-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.grade === grade);
    });
  }

  function updateHintButtonLabel() {
    const left = MAX_HINTS - hintLevel;
    hintBtn.textContent = left > 0 ? `💡 Hint (${left} left)` : "💡 No more hints";
  }

  // Messages are transient: show the pill, then fade it out on its own so a
  // stale "Not enough letters!" can't sit on screen for the rest of the game.
  function setMessage(text, holdMs) {
    clearTimeout(messageTimer);
    messageBar.textContent = text;
    messageBar.classList.add("show");
    messageTimer = setTimeout(() => {
      messageBar.classList.remove("show");
    }, holdMs || 1400);
  }

  function clearMessage() {
    clearTimeout(messageTimer);
    messageBar.textContent = "";
    messageBar.classList.remove("show");
  }

  // ---------- Input handling ----------
  function handleKeyInput(key) {
    if (gameOver || isRevealing) return;
    if (key === "ENTER") {
      submitGuess();
    } else if (key === "BACK") {
      currentGuess = currentGuess.slice(0, -1);
      renderCurrentRow();
    } else if (/^[A-Z]$/.test(key)) {
      if (currentGuess.length < COLS) {
        currentGuess += key;
        renderCurrentRow();
      }
    }
  }

  function renderCurrentRow() {
    for (let c = 0; c < COLS; c++) {
      const tile = document.getElementById("tile-" + currentRow + "-" + c);
      const letter = currentGuess[c] || "";
      tile.textContent = letter;
      tile.classList.toggle("filled", !!letter);
    }
  }

  function shakeRow() {
    const row = document.getElementById("row-" + currentRow);
    row.classList.add("shake");
    setTimeout(() => row.classList.remove("shake"), 400);
  }

  function submitGuess() {
    if (currentGuess.length < COLS) {
      shakeRow();
      setMessage("Not enough letters!");
      return;
    }
    const result = evaluateGuess(currentGuess, targetWord);
    const guessedRow = currentRow;
    revealRow(guessedRow, currentGuess, result);

    const won = currentGuess === targetWord;
    const lastRow = currentRow === ROWS - 1;

    isRevealing = true;
    setTimeout(() => {
      isRevealing = false;
      if (won) {
        gameOver = true;
        bounceRow(guessedRow);
        playWinSound();
        launchConfetti();
        // Let the winning row take its bow before the modal covers it.
        setTimeout(() => showEndModal(true), 900);
      } else if (lastRow) {
        gameOver = true;
        playLoseSound();
        showEndModal(false);
      }
    }, REVEAL_MS);

    currentRow++;
    currentGuess = "";
  }

  function bounceRow(rowIndex) {
    const row = document.getElementById("row-" + rowIndex);
    if (!row) return;
    row.classList.add("bounce");
    // Last tile starts at 320ms and runs 550ms, so hold the class past 870ms.
    setTimeout(() => row.classList.remove("bounce"), 1000);
  }

  function evaluateGuess(guess, target) {
    const result = new Array(COLS).fill("absent");
    const targetLetters = target.split("");
    const guessLetters = guess.split("");
    const used = new Array(COLS).fill(false);

    for (let i = 0; i < COLS; i++) {
      if (guessLetters[i] === targetLetters[i]) {
        result[i] = "correct";
        used[i] = true;
      }
    }
    for (let i = 0; i < COLS; i++) {
      if (result[i] === "correct") continue;
      const idx = targetLetters.findIndex(
        (l, j) => !used[j] && l === guessLetters[i]
      );
      if (idx !== -1) {
        result[i] = "present";
        used[idx] = true;
      }
    }
    return result;
  }

  function revealRow(rowIndex, guess, result) {
    let anyPresent = false;
    let anyCorrect = false;
    for (let c = 0; c < COLS; c++) {
      const tile = document.getElementById("tile-" + rowIndex + "-" + c);
      const letter = guess[c];
      const status = result[c];
      setTimeout(() => {
        tile.classList.add("flip");
        setTimeout(() => {
          tile.classList.add(status);
          updateKeyStatus(letter, status);
        }, 275);
      }, c * 120);
      if (status === "correct") anyCorrect = true;
      if (status === "present") anyPresent = true;
    }
    setTimeout(() => {
      if (guess === targetWord) {
        // handled by win flow
      } else if (anyCorrect || anyPresent) {
        playPresentSound();
      } else {
        playWrongSound();
      }
      if (guess === targetWord) playCorrectSound();
    }, COLS * 120 + 280);
  }

  function updateKeyStatus(letter, status) {
    const rank = { absent: 0, present: 1, correct: 2 };
    if (!keyStatus[letter] || rank[status] > rank[keyStatus[letter]]) {
      keyStatus[letter] = status;
      const keyEl = document.getElementById("key-" + letter);
      if (keyEl) {
        keyEl.classList.remove("correct", "present", "absent");
        keyEl.classList.add(status);
      }
    }
  }

  // ---------- End of round ----------
  const WIN_TITLES = [
    "🎉 You got it!",
    "⭐ Amazing!",
    "🌟 Great job!",
    "🎈 You did it!"
  ];

  function showEndModal(won) {
    modalTitle.textContent = won
      ? WIN_TITLES[Math.floor(Math.random() * WIN_TITLES.length)]
      : "Good try!";
    modalWord.textContent = targetWord;
    modalDefinition.textContent = targetHint;
    overlay.classList.add("show");
    playAgainBtn.focus();
  }

  playAgainBtn.addEventListener("click", () => {
    playAgainBtn.blur();
    resetGame();
  });
  newWordBtn.addEventListener("click", () => {
    newWordBtn.blur();
    resetGame();
  });

  // ---------- Hint ----------
  // Three tiers, unlocked one click at a time and shown cumulatively so
  // earlier hints stay visible: a vague category, then the fuller
  // definition, then that definition plus the first letter. Only the last
  // tier reveals any letter, and only ever the first one.
  function renderHint(level) {
    const line = document.createElement("div");
    line.className = "hint-line tier-" + level;

    if (level === 1) {
      line.textContent = `Hint 1 — It's ${targetCategory}.`;
    } else if (level === 2) {
      line.textContent = `Hint 2 — ${targetHint}`;
    } else {
      // Only this tier reveals a letter, and only ever the first one.
      const skeleton = targetWord[0] + " _".repeat(targetWord.length - 1);
      line.textContent = `Hint 3 — It starts with ${targetWord[0]}: `;
      const b = document.createElement("b");
      b.textContent = skeleton;
      line.appendChild(b);
    }
    return line;
  }

  hintBtn.addEventListener("click", () => {
    hintBtn.blur();
    if (gameOver || hintLevel >= MAX_HINTS) return;
    hintLevel++;
    hintBox.appendChild(renderHint(hintLevel));
    updateHintButtonLabel();
    if (hintLevel >= MAX_HINTS) hintBtn.disabled = true;
  });

  // ---------- Grade selector ----------
  gradeSelector.addEventListener("click", (e) => {
    const btn = e.target.closest(".grade-btn");
    if (!btn) return;
    btn.blur();
    resetGame(btn.dataset.grade);
  });

  // ---------- Physical keyboard ----------
  // Buttons stay focused after a click/tap; without preventDefault a later
  // Enter/Space keydown would re-activate that focused button natively
  // (e.g. re-clicking the grade button and silently resetting the board).
  document.addEventListener("keydown", (e) => {
    if (overlay.classList.contains("show")) return;
    const key = e.key.toUpperCase();
    if (key === "ENTER") {
      e.preventDefault();
      handleKeyInput("ENTER");
    } else if (key === "BACKSPACE") {
      e.preventDefault();
      handleKeyInput("BACK");
    } else if (/^[A-Z]$/.test(key) && key.length === 1) {
      e.preventDefault();
      handleKeyInput(key);
    }
  });

  // ---------- Confetti ----------
  function launchConfetti() {
    if (reduceMotion.matches) return;
    const colors = ["#6aaa64", "#c9b458", "#f4a261", "#e76f51", "#457b9d", "#e63946"];
    const count = 80;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      // Inset from the edges so nothing pokes past the viewport.
      piece.style.left = (2 + Math.random() * 96) + "vw";
      piece.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      piece.style.animationDuration = (2 + Math.random() * 1.5) + "s";

      const inner = document.createElement("i");
      inner.style.background = colors[Math.floor(Math.random() * colors.length)];
      inner.style.animationDuration = (0.4 + Math.random() * 0.7) + "s";
      if (Math.random() < 0.4) inner.style.borderRadius = "50%";
      piece.appendChild(inner);

      frag.appendChild(piece);
      setTimeout(() => piece.remove(), 3600);
    }
    document.body.appendChild(frag);
  }

  // ---------- Init ----------
  resetGame(grade);
})();
</script>
</body>
